name: Build Acheron 32-bit with Voice

on:
  push:
    branches: [master, ci/**]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows-32bit-voice:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5 (MSVC 32-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win32_msvc2019'
          cache: true

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          git -C vendor/vcpkg fetch --unshallow
          call .\vendor\vcpkg\bootstrap-vcpkg.bat

      - name: Force Install 32-bit Voice Libraries (Classic Mode)
        shell: cmd
        run: |
          .\vendor\vcpkg\vcpkg install openssl:x86-windows nlohmann-json:x86-windows catch2:x86-windows opus:x86-windows libsodium:x86-windows rapidjson:x86-windows rlottie:x86-windows nayuki-qr-code-generator:x86-windows --classic

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%;%GITHUB_WORKSPACE%/build/vcpkg_installed/x86-windows" -DCURL_INCLUDE_DIR="%GITHUB_WORKSPACE%/build/vcpkg_installed/x86-windows/include" -DCURL_LIBRARY="%GITHUB_WORKSPACE%/build/vcpkg_installed/x86-windows/lib/libcurl.lib" -DBUILD_TESTS=OFF -DENABLE_VOICE=ON -DENABLE_RNNOISE=ON -DENABLE_FFMPEG=ON

      - name: Build App
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        shell: cmd
        run: |
          windeployqt --no-translations --no-opengl-sw --no-system-d3d-compiler build\Release\acheron.exe

      - name: Prepare Artifact Folder
        shell: cmd
        run: |
          mkdir acheron-windows7-32bit-voice
          xcopy build\Release\* acheron-windows7-32bit-voice\ /E /Y
          xcopy build\vcpkg_installed\x86-windows\bin\*.dll acheron-windows7-32bit-voice\ /Y
          rmdir /S /Q acheron-windows7-32bit-voice\CMakeFiles

      - name: Upload 32-bit App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: acheron-windows7-32bit-voice
          path: acheron-windows7-32bit-voice
          
