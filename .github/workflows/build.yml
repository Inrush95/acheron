name: Build Acheron 32-bit with Voice

on:
  push:
    branches: [master, ci/**]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FFMPEG_RELEASE_TAG: autobuild-2026-07-31-14-10
  FFMPEG_WINDOWS_BUILD: ffmpeg-n8.1.2-34-g9b6c8969e0-win32-lgpl-shared-8.1

jobs:
  build-windows-32bit-voice:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5 (MSVC 32-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win32_msvc2019'
          cache: true

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          git -C vendor/vcpkg fetch --unshallow
          call .\vendor\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-x86-windows-static-md-${{ hashFiles('vcpkg.json') }}

      - name: Install 32-bit FFmpeg
        shell: cmd
        run: |
          curl -L -o ffmpeg.zip https://github.com
          powershell Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          move ffmpeg-extract\%FFMPEG_WINDOWS_BUILD% ffmpeg

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -A Win32 -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x86-windows-static-md -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%;%GITHUB_WORKSPACE%/ffmpeg" -DBUILD_TESTS=OFF -DENABLE_VOICE=ON -DENABLE_RNNOISE=ON -DENABLE_FFMPEG=ON

      - name: Build App
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        shell: cmd
        run: |
          windeployqt --no-translations --no-opengl-sw --no-system-d3d-compiler build\Release\acheron.exe

      - name: Prepare Artifact Folder
        shell: cmd
        run: |
          mkdir acheron-windows7-32bit-voice
          xcopy build\Release\* acheron-windows7-32bit-voice\ /E /Y
          xcopy ffmpeg\bin\*.dll acheron-windows7-32bit-voice\ /Y
          rmdir /S /Q acheron-windows7-32bit-voice\CMakeFiles

      - name: Upload 32-bit App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: acheron-windows7-32bit-voice
          path: acheron-windows7-32bit-voice
          
