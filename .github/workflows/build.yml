name: Build Acheron 32-bit with Voice

on:
  push:
    branches: [master, ci/**]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FFMPEG_RELEASE_TAG: autobuild-2026-07-31-14-10
  FFMPEG_WINDOWS_BUILD: ffmpeg-n8.1.2-34-g9b6c8969e0-win32-lgpl-shared-8.1

jobs:
  build-windows-32bit-voice:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5 (MSVC 32-bit for Win7)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win32_msvc2019' # Swapped to the pre-installed Visual Studio compiler
          modules: qtimageformats
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git -C vendor/vcpkg fetch --unshallow
          ./vendor/vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-x86-windows-static-md-\${{ hashFiles('vcpkg.json') }}

      - name: Install 32-bit FFmpeg (For Voice/Audio)
        shell: pwsh
        run: |
          \$url = "https://github.com\({{ env.FFMPEG_RELEASE_TAG }}/\){{ env.FFMPEG_WINDOWS_BUILD }}.zip"
          Invoke-WebRequest -Uri \$url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          \$inner = Get-ChildItem -Path ffmpeg-extract -Directory | Select-Object -First 1
          Move-Item -Path \$inner.FullName -Destination ffmpeg

      - name: Configure CMake for 32-bit (x86) + Voice
        shell: pwsh
        run: |
          ffmpegDir = "{{ github.workspace }}/ffmpeg"
          cmake -B build -S . `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static-md `
            -DCMAKE_PREFIX_PATH="\(env:QT_ROOT_DIR;\)ffmpegDir" `
            -DBUILD_TESTS=OFF `
            -DENABLE_VOICE=ON `
            -DENABLE_RNNOISE=ON `
            -DENABLE_FFMPEG=ON

      - name: Build App
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        shell: pwsh
        run: |
          exe = "{{ github.workspace }}/build/Release/acheron.exe"
          windeployqt --no-translations --no-opengl-sw --no-system-d3d-compiler \$exe

      - name: Prepare Artifact Folder
        shell: pwsh
        run: |
          \$out = "acheron-windows7-32bit-voice"
          \$binDir = "build/Release"
          ffmpegDir = "{{ github.workspace }}/ffmpeg"
          New-Item -ItemType Directory -Path \$out -Force
          
          Copy-Item "binDir/*" out -Recurse -Force
          Copy-Item "ffmpegDir/bin/*.dll" out -Force
          Remove-Item "\$out/CMakeFiles" -Recurse -ErrorAction SilentlyContinue

      - name: Upload 32-bit App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: acheron-windows7-32bit-voice
          path: acheron-windows7-32bit-voice
          
